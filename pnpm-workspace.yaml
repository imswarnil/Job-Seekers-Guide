allowBuilds:
  sharp: true
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
  # wrangler's local runtime; its install step checks the platform binary.
  workerd: true
  # Pulled in transitively by the auth SDK; its script only prints a banner.
  core-js: false
  puppeteer: set this to true or false

overrides:
  h3: 1.15.11
  # Security floors for transitive build-time dependencies, so the advisories
  # Dependabot keeps failing to patch are actually patched. Scoped per major
  # so no package is forced across a breaking line.
  undici: '>=8.10.2'
  brace-expansion@1: '>=1.1.12'
  brace-expansion@2: '>=2.0.2'
  brace-expansion@5: '>=5.0.12'
  js-yaml: '>=4.3.2 <5'
