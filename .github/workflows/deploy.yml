name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # So a broken build can be redeployed, or a content-only fix pushed, without
  # having to make an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. `cancel-in-progress: false` because cancelling a
# half-finished upload can leave the Worker on a mix of old and new assets.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://jobseekers.imswarnil.com

    env:
      # Canonicals, og:url, the sitemap and absolute OG image URLs are all
      # derived from this. Wrong here means every social preview 404s.
      NUXT_PUBLIC_SITE_URL: https://jobseekers.imswarnil.com

    steps:
      - uses: actions/checkout@v7

      # No version pinned here on purpose — it reads `packageManager` from
      # package.json, so the lockfile and the CI installer can never drift.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # These run before the build on purpose: a type error, a broken lesson or
      # a subject folder that collides with a reserved slug should stop the
      # deploy, not appear next to a green tick.
      - run: pnpm check:lessons
      - run: pnpm lint
      - run: pnpm typecheck

      - run: pnpm build

      # Every guide page must be a real prerendered file. If prerendering
      # silently produced only the landing page, the Worker would deploy and
      # render everything else on demand from an empty D1.
      - name: Check the build is not empty
        run: |
          pages=$(find .output/public -name index.html | wc -l | tr -d ' ')
          echo "Prerendered $pages pages."
          if [ "$pages" -lt 20 ]; then
            echo "::error::Only $pages pages were prerendered, expected at least 20. The crawler probably failed to reach the path."
            exit 1
          fi
          test -f .output/server/wrangler.json || { echo "::error::.output/server/wrangler.json missing: the cloudflare_module preset did not run."; exit 1; }

      # Deploys .output via the redirect in .wrangler/deploy/config.json that
      # the build wrote. Secrets are set once with `wrangler secret put` and are
      # not touched here. CLOUDFLARE_API_TOKEN needs "Edit Cloudflare Workers"
      # plus D1 and R2 edit on the account (docs/backend.md).
      # Until the CLOUDFLARE_API_TOKEN repo secret exists, deploys are done by
      # hand with `pnpm deploy`, and this step says so instead of failing.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so this run only checked the build. Deploy with 'pnpm deploy'."
            exit 0
          fi
          pnpm exec wrangler deploy
